<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verifica autenticità</title>
<meta name="description" content="Verifica che il tuo prodotto sia autentico e accedi ai contenuti pensati per te. Prototipo dimostrativo: nessuna verifica reale viene effettuata.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TOKENS
   The landing is light; every step after it sits over the product imagery and
   is therefore light-on-dark. Both are deliberate, so there is no
   prefers-color-scheme switching.
   ========================================================================== */
:root{
  --paper:#ffffff;
  --ink:#111111;
  --ink-quiet:#4a4a4a;
  --ink-faint:#767676;
  --on-dark:#ffffff;
  --on-dark-quiet:#dcdcdc;
  --panel:#ffffff;
  --panel-ink:#111111;
  --panel-hover:#ededed;
  --drawer:#000000;
  --scrim:rgba(0,0,0,.55);
  --hairline:#e2e2e2;
  --focus:#1a6ee8;
  --focus-on-dark:#8fd8ff;
  --ok:#1f8f5f;
  --warn:#9a6b00;
  --bad:#c02626;

  --pad:20px;
  --col:640px;
  --header-h:64px;
  --bar-w:4px;
  --tap:56px;

  --fs-title:clamp(1.25rem,1.06rem + .82vw,1.625rem);
  --fs-lead:clamp(1rem,.96rem + .2vw,1.0625rem);
  --fs-action:clamp(.875rem,.85rem + .12vw,.9375rem);
  --fs-small:.8125rem;

  --ease:cubic-bezier(.4,0,.2,1);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100svh;
  background:var(--paper);color:var(--ink);
  font-family:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;margin:0}
input{font:inherit;color:inherit}
img,video{display:block;max-width:100%}

:where(a,button,input,summary,[tabindex]):focus-visible{
  outline:3px solid var(--focus);outline-offset:2px;border-radius:2px;
}
.on-dark :where(a,button,input,summary,[tabindex]):focus-visible,
#drawer :where(a,button,input,summary,[tabindex]):focus-visible{
  outline-color:var(--focus-on-dark);
}
@media (forced-colors:active){
  :where(a,button,input,summary,[tabindex]):focus-visible{outline:3px solid Highlight}
}
.visually-hidden{
  position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}
.col{width:min(var(--col),100%);margin-inline:auto;padding-inline:var(--pad)}

/* ==========================================================================
   STAGE — the product imagery behind every step after the landing
   ========================================================================== */
#stage{position:fixed;inset:0;z-index:0;background:#000;overflow:hidden}
#stage[hidden]{display:none}
#stage img,#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Placeholder used until the brand assets are dropped in. */
#stage .placeholder{
  position:absolute;inset:0;
  background:
    radial-gradient(70% 45% at 50% 22%, #3a3a3e 0%, transparent 70%),
    linear-gradient(180deg,#161618 0%,#0b0b0c 60%,#000 100%);
}
/* Scrim: the option blocks are white, but the headline and the powered-by row
   sit directly on the photograph, so the image must never wash them out. */
/* The brand supplies the photograph, so its brightness is unknown. A flat
   base under the gradient guarantees a contrast floor whatever arrives:
   against a pure white image the composited mid-band still leaves white text
   above 5:1. Without the base a light photo washes the text out entirely. */
#stage .scrim{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.34) 22%,rgba(0,0,0,.30) 58%,rgba(0,0,0,.78) 100%),
    rgba(0,0,0,.42);
}
.shell{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column}

/* ==========================================================================
   HEADER
   ========================================================================== */
#top{
  flex:none;height:var(--header-h);
  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
  padding-inline:max(12px,env(safe-area-inset-left));
  width:min(var(--col),100%);margin-inline:auto;
}
#top > .top__back{grid-column:1;justify-self:start}
#top > .brand{grid-column:2;justify-self:center}
#top > .top__menu{grid-column:3;justify-self:end}

.top__back,.top__menu{
  display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;cursor:pointer;color:var(--ink);
}
.top__back[hidden]{display:none}
.on-dark .top__back,.on-dark .top__menu{color:var(--on-dark)}

/* BRAND LOGO SLOT -----------------------------------------------------------
   The client's own logo is dropped in through ASSETS.logo in the script below.
   Until then this typographic placeholder stands in. No third-party mark is
   reproduced here. */
.brand{display:flex;align-items:center;justify-content:center;min-height:44px}
.brand img{max-height:34px;width:auto}
.brand__text{
  font-size:clamp(1rem,.93rem + .3vw,1.1875rem);font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;color:var(--ink);
}
.on-dark .brand__text{color:var(--on-dark)}

/* ==========================================================================
   LANDING
   ========================================================================== */
main{flex:1 0 auto;display:flex;flex-direction:column}
.step[hidden]{display:none}
#step-landing{padding-bottom:40px}

.hero{width:100%;aspect-ratio:3/2;background:#000;position:relative;overflow:hidden}
.hero img,.hero video{width:100%;height:100%;object-fit:cover}
.hero .placeholder{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(70% 50% at 50% 34%, #3a3a3e 0%, transparent 72%),
    linear-gradient(180deg,#161618 0%,#0b0b0c 100%);
  color:rgba(255,255,255,.42);font-size:var(--fs-small);letter-spacing:.14em;
  text-transform:uppercase;text-align:center;padding:0 24px;
}

.welcome{padding-top:32px;text-align:center}
.welcome h1{
  font-size:var(--fs-title);font-weight:700;letter-spacing:.02em;text-transform:uppercase;
}
.welcome p{
  margin-top:14px;font-size:var(--fs-lead);line-height:1.55;color:var(--ink);
  text-wrap:pretty;
}

.cta{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:var(--tap);padding:18px 20px;margin-top:34px;
  cursor:pointer;border-radius:0;
  background:var(--ink);color:var(--paper);
  font-size:var(--fs-action);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  transition:background .16s var(--ease);
}
.cta:hover{background:#2f2f2f}

.legal{margin-top:18px;text-align:center;font-size:var(--fs-small);line-height:1.7;color:var(--ink-quiet)}
.legal button{text-decoration:underline;cursor:pointer;color:inherit}
.legal button:hover{color:var(--ink)}
.on-dark .legal{color:var(--on-dark-quiet)}

/* ==========================================================================
   STEP HEAD — white accent bar beside the question
   ========================================================================== */
.step-head{display:flex;gap:18px;min-height:120px;margin:24px 0 32px}
.step-head::before{content:"";flex:none;width:var(--bar-w);background:var(--on-dark);align-self:stretch}
.step-head h1{
  font-size:var(--fs-title);font-weight:700;line-height:1.3;color:var(--on-dark);
  text-wrap:balance;padding-top:2px;
}

/* ==========================================================================
   OPTION BLOCKS — separate white bars with a gap, not one joined panel
   ========================================================================== */
.options{display:flex;flex-direction:column;gap:14px}
.options button{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;min-height:var(--tap);padding:16px 20px;cursor:pointer;
  background:var(--panel);color:var(--panel-ink);
  font-size:var(--fs-action);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  transition:background .16s var(--ease);
}
.options button:hover{background:var(--panel-hover)}
.options svg{flex:none}

/* ==========================================================================
   STORE STEP
   ========================================================================== */
.search{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--on-dark);padding-bottom:10px}
.search svg{flex:none;color:var(--on-dark)}
.search input{flex:1 1 auto;min-width:0;background:none;border:0;padding:8px 0;
  font-size:1rem;color:var(--on-dark)}
.search input::placeholder{color:rgba(255,255,255,.62)}
.search input:focus{outline:none}
.search:focus-within{border-bottom-color:var(--focus-on-dark)}
@media (forced-colors:active){.search input:focus{outline:3px solid Highlight;outline-offset:3px}}

.searchrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px}
.iconbtn{display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:var(--on-dark);
  padding:10px 2px;font-size:var(--fs-small)}
.ghost{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--on-dark);
  padding:10px 2px;font-size:var(--fs-action);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}

.stores{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.store{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  padding:16px 18px;background:var(--panel);color:var(--panel-ink);
  transition:background .16s var(--ease);
}
.store:hover{background:var(--panel-hover)}
/* Entries the directory holds only partially are drawn as outlines. */
/* Outlined cards carry white text with no panel behind it, so they need their
   own backdrop rather than relying on the scrim alone. */
.store--outline{background:rgba(0,0,0,.42);color:var(--on-dark);border:2px solid var(--on-dark)}
.store--outline:hover{background:rgba(0,0,0,.62)}
.store__body{flex:1 1 auto;min-width:0}
.store__name{font-size:1.0625rem;font-weight:600;line-height:1.3}
.store__meta{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:var(--fs-small)}
.store__addr{margin-top:4px;font-size:var(--fs-small);line-height:1.45;
  text-decoration:underline dotted;text-underline-offset:3px}
.store svg{flex:none}

.morelink{display:block;margin:26px auto 0;cursor:pointer;color:var(--on-dark);
  font-size:var(--fs-action);font-weight:600;text-decoration:underline;text-underline-offset:4px}

.note{margin-top:18px;font-size:var(--fs-small);line-height:1.55;color:var(--on-dark-quiet);min-height:1.4em}

/* ==========================================================================
   PROCESSING + VERDICT
   ========================================================================== */
.processing{text-align:center;padding:40px 0}
.spinner{width:46px;height:46px;margin:0 auto 22px;border-radius:50%;
  border:3px solid rgba(255,255,255,.25);border-top-color:var(--on-dark);
  animation:spin 900ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
.processing p{color:var(--on-dark-quiet);font-size:var(--fs-lead);min-height:1.5em}

.verdict{padding-bottom:8px}
.verdict__mark{min-height:56px;margin-bottom:20px;color:var(--on-dark)}
.verdict h1{font-size:var(--fs-title);font-weight:700;line-height:1.3;color:var(--on-dark);margin-bottom:14px}
.verdict .lede{font-size:var(--fs-lead);line-height:1.6;color:var(--on-dark-quiet)}
.verdict[data-v="genuine"] .verdict__mark{color:#6ee7a8}
.verdict[data-v="suspicious"] .verdict__mark{color:#ffd166}
.verdict[data-v="fake"] .verdict__mark{color:#ff9b9b}
.steps{margin-top:22px;padding-left:1.3em;list-style:decimal;
  font-size:.9375rem;line-height:1.7;color:var(--on-dark-quiet)}
.steps li{margin-bottom:6px}
.steps li::marker{color:var(--on-dark)}
.cta--light{background:var(--panel);color:var(--panel-ink)}
.cta--light:hover{background:var(--panel-hover)}

/* ==========================================================================
   POWERED BY — service attribution slot
   ========================================================================== */
.poweredby{
  flex:none;display:flex;align-items:center;justify-content:center;gap:9px;
  padding:26px 20px max(26px,env(safe-area-inset-bottom));
  font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--on-dark-quiet);
}
.poweredby .mark{display:inline-flex;align-items:center;gap:7px;color:var(--on-dark)}
.poweredby[hidden]{display:none}

/* ==========================================================================
   DRAWER
   ========================================================================== */
#drawer-backdrop{position:fixed;inset:0;z-index:70;background:var(--scrim);
  opacity:0;transition:opacity .22s var(--ease)}
#drawer-backdrop[hidden]{display:none}
#drawer-backdrop.is-open{opacity:1}
#drawer{
  position:fixed;top:0;right:0;bottom:0;z-index:71;
  width:min(78vw,420px);background:var(--drawer);color:var(--on-dark);
  display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top)) 0 max(24px,env(safe-area-inset-bottom));
  transform:translateX(100%);transition:transform .26s var(--ease);
  overflow-y:auto;
}
#drawer[hidden]{display:none}
#drawer.is-open{transform:translateX(0)}
@media (prefers-reduced-motion:reduce){
  #drawer,#drawer-backdrop{transition:none}
}
.drawer__bar{display:flex;justify-content:flex-end;padding-inline:12px;flex:none}
.drawer__close{display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;cursor:pointer;color:var(--on-dark)}
.drawer__nav{padding:22px 34px 0;display:flex;flex-direction:column;gap:26px}
.drawer__group{display:flex;flex-direction:column;gap:18px}
.drawer__nav button{
  display:flex;align-items:center;gap:18px;cursor:pointer;text-align:left;
  font-size:1.0625rem;color:var(--on-dark);padding:4px 0;
}
.drawer__nav button span{text-decoration:underline;text-underline-offset:4px}
.drawer__nav button:hover span{text-decoration-thickness:2px}
.drawer__nav svg{flex:none;opacity:.9}
.drawer__note{margin:24px 34px 0;font-size:var(--fs-small);line-height:1.6;color:#bdbdbd;min-height:1.4em}

.lang{display:flex;gap:8px;margin:6px 0 0 42px}
.lang button{min-width:44px;height:36px;cursor:pointer;border:1px solid rgba(255,255,255,.4);
  font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#cfcfcf}
.lang button[aria-pressed="true"]{background:var(--on-dark);color:#000;border-color:var(--on-dark)}
.lang[hidden]{display:none}

/* ==========================================================================
   DEMO NOTICE — must stay legible on both the light and the dark screens
   ========================================================================== */
.demo{
  width:min(var(--col),100%);margin:32px auto 0;
  border:1px solid #b8891f;border-left-width:4px;background:#fff8e6;color:#4a3708;
  padding:14px 16px;font-size:var(--fs-small);line-height:1.6;
}
.demo strong{color:#3a2b05;font-weight:600}
.demo p + p{margin-top:9px}
.demo a{color:#6a4c0a;text-decoration:underline}
.demo code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95em;
  background:#f2e3bf;padding:1px 5px;border-radius:3px;white-space:nowrap}
.demo__short{display:none}
.demo[data-mode="compact"]{padding:10px 14px;margin-top:20px}
.demo[data-mode="compact"] .demo__full{display:none}
.demo[data-mode="compact"] .demo__short{display:block}
.demo--dark{background:rgba(0,0,0,.72);border-color:#e0b64d;color:#f6e3b6}
.demo--dark strong{color:#ffeec0}
.demo--dark code{background:rgba(255,255,255,.14);color:#ffeec0}
.demo--dark a{color:#ffd98a}

@media (min-width:700px){
  :root{--pad:24px}
  .hero{aspect-ratio:16/9}
}
</style>
</head>
<body>

<div id="stage" hidden>
  <div class="placeholder" id="stage-placeholder"></div>
  <video id="stage-video" playsinline muted loop hidden></video>
  <img id="stage-img" alt="" hidden>
  <div class="scrim"></div>
</div>

<div class="shell" id="shell">

  <header id="top">
    <button class="top__back" id="btn-back" type="button" hidden>
      <span class="visually-hidden" data-i18n="ui.back">Indietro</span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    </button>

    <!-- BRAND LOGO SLOT — filled from ASSETS.logo in the script. -->
    <div class="brand" id="brand">
      <span class="brand__text" data-i18n="ui.brand">Il tuo brand</span>
    </div>

    <button class="top__menu" id="btn-menu" type="button" aria-expanded="false" aria-controls="drawer">
      <span class="visually-hidden" data-i18n="ui.menu">Menu</span>
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 8h16M9 13h12M13 18h8"/></svg>
    </button>
  </header>

  <main>

    <!-- LANDING ---------------------------------------------------------- -->
    <section class="step" id="step-landing">
      <div class="hero" id="hero">
        <div class="placeholder" id="hero-placeholder" data-i18n="ui.imageSlot">Spazio immagine prodotto</div>
        <video id="hero-video" playsinline muted loop hidden></video>
        <img id="hero-img" alt="" hidden>
      </div>
      <div class="col welcome">
        <h1 id="h-landing" tabindex="-1" data-i18n="landing.title">Benvenuto</h1>
        <p data-i18n="landing.lead">Verifica che il tuo prodotto sia autentico e accedi ai contenuti pensati per te.</p>
        <button class="cta" id="btn-verify" type="button" data-i18n="landing.cta">Verifica l'autenticità</button>
        <p class="legal">
          <span data-i18n="landing.legalLead">Iniziando l'autenticazione accetti i nostri</span>
          <button type="button" class="legal-link" data-i18n="ui.terms">Termini e Condizioni</button>
          <span data-i18n="landing.legalAnd">e la</span>
          <button type="button" class="legal-link" data-i18n="ui.privacy">Privacy Policy</button>
        </p>
        <p class="legal" id="legal-note" role="status" aria-live="polite"></p>
      </div>
    </section>

    <!-- WHEN -------------------------------------------------------------- -->
    <section class="step col on-dark" id="step-when" hidden>
      <div class="step-head"><h1 id="h-when" tabindex="-1" data-i18n="when.title">Sto verificando l'autenticità:</h1></div>
      <div class="options" id="opts-when"></div>
    </section>

    <!-- WHERE ------------------------------------------------------------- -->
    <section class="step col on-dark" id="step-where" hidden>
      <div class="step-head"><h1 id="h-where" tabindex="-1" data-i18n="where.title">Dove hai trovato il prodotto?</h1></div>
      <div class="options" id="opts-where"></div>
    </section>

    <!-- PLACE ------------------------------------------------------------- -->
    <section class="step col on-dark" id="step-place" hidden>
      <div class="step-head"><h1 id="h-place" tabindex="-1"></h1></div>
      <form id="form-place" novalidate>
        <div class="search">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <input id="place-q" type="search" autocomplete="off" spellcheck="false" aria-describedby="place-note">
        </div>
        <div class="searchrow">
          <button class="iconbtn" id="btn-near" type="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a4 4 0 0 1 4 4c0 2-1.4 3.7-3.2 4v3.2h-1.6V10A4 4 0 0 1 12 2Zm-5 18c0-1.9 2.2-3.4 5-3.4s5 1.5 5 3.4v2H7v-2Z"/></svg>
            <span class="visually-hidden" id="near-label"></span>
          </button>
          <button class="ghost" id="btn-skip" type="submit">
            <span data-i18n="ui.skip">Salta</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
          </button>
        </div>
      </form>
      <ul class="stores" id="stores"></ul>
      <button class="morelink" id="btn-more" type="button" data-i18n="place.all">Vedi tutti i negozi</button>
      <p class="note" id="place-note" role="status" aria-live="polite"></p>
    </section>

    <!-- PROCESSING -------------------------------------------------------- -->
    <section class="step col on-dark" id="step-processing" hidden>
      <div class="step-head"><h1 id="h-processing" tabindex="-1" data-i18n="when.title">Sto verificando l'autenticità:</h1></div>
      <div class="processing">
        <div class="spinner" aria-hidden="true"></div>
        <p id="processing-status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <!-- RESULT ------------------------------------------------------------ -->
    <section class="step col on-dark" id="step-result" hidden>
      <div class="verdict" id="verdict" data-v="">
        <div class="verdict__mark" id="verdict-mark" aria-hidden="true"></div>
        <h1 id="h-result" tabindex="-1"></h1>
        <p class="lede" id="verdict-lede" role="status" aria-live="polite" aria-atomic="true"></p>
        <ol class="steps" id="verdict-steps" role="list"></ol>
        <button class="cta cta--light" id="btn-again" type="button" data-i18n="result.again">Ricomincia</button>
      </div>
    </section>

    <aside class="demo" id="demo"></aside>
  </main>

  <div class="poweredby" id="poweredby" hidden>
    <span data-i18n="ui.poweredBy">Powered by</span>
    <!-- SERVICE MARK SLOT — filled from ASSETS.serviceLogo in the script. -->
    <span class="mark" id="service-mark"></span>
  </div>
</div>

<div id="drawer-backdrop" hidden></div>
<nav id="drawer" hidden aria-label="Menu">

<script>
(function () {
  "use strict";

  /* ======================================================================
     ASSET SLOTS
     Drop the brand files in here and nothing else needs to change.
     Paths are relative to this file, e.g. "assets/hero.jpg".
       logo         header brand logo (SVG or PNG, transparent, ~34px tall)
       serviceLogo  the "powered by" mark next to the service name
       hero         landing image (3:2 on phones, 16:9 from 700px up)
       heroVideo    optional landing video; takes precedence over hero
       background   full-bleed image behind every step after the landing
       backgroundVideo optional; takes precedence over background
     ====================================================================== */
  var ASSETS = {
    logo: "",
    serviceLogo: "",
    serviceName: "",
    hero: "",
    heroVideo: "",
    background: "",
    backgroundVideo: ""
  };

  /* ---------------------------------------------------------------- i18n */
  var I18N = {
    it: {

      "where.title": "Dove hai trovato il prodotto?",

      "processing.p3": "Preparazione dell'esito…",

      "result.again": "Ricomincia",
      "result.genuine.title": "Il prodotto risulta autentico",
      "result.genuine.lede": "Nella simulazione questo articolo corrisponde a un prodotto registrato e il contesto d'acquisto che hai indicato non presenta anomalie.",
      "result.suspicious.title": "Servono altre informazioni",
      "result.suspicious.lede": "Nella simulazione questo articolo risulta registrato, ma il contesto d'acquisto contiene elementi che meritano un approfondimento.",

      "result.fake.lede": "Nella simulazione questo articolo non corrisponde ad alcun prodotto registrato. È l'esito che il servizio restituirebbe per un articolo non riconosciuto.",
      "result.notFound.title": "Articolo non registrato",
      "result.notFound.lede": "Nella simulazione questo articolo non esiste in archivio. Di solito significa che il codice è stato letto male.",
      "result.s1": "Conserva lo scontrino e la confezione.",

      "result.s3": "Contatta il servizio clienti del brand e riferisci l'esito.",
      "result.s4": "Se hai acquistato online, segnala l'inserzione alla piattaforma.",

      "demo.title": "Prototipo dimostrativo.",
      "demo.body": "Questa pagina non esegue alcuna verifica reale: l'esito è simulato dal browser e non proviene da un servizio di autenticazione. Non usarla per stabilire se un prodotto è autentico.",
      "demo.assets": "Le immagini e il video sono segnaposto: verranno sostituiti dai file forniti dal brand.",
      "demo.try": "Esiti di prova:",
      "demo.short": "L'esito è simulato: nessuna verifica reale viene effettuata."
    },
    en: {
      "meta.title": "Authenticity check",
      "ui.brand": "Your brand",
      "ui.back": "Back",
      "ui.menu": "Menu",
      "ui.close": "Close the menu",
      "ui.skip": "Skip",
      "ui.terms": "Terms and Conditions",
      "ui.privacy": "Privacy Policy",
      "ui.poweredBy": "Powered by",
      "ui.service": "Authentication service",
      "ui.imageSlot": "Product image slot",
      "ui.lang": "Language",

      "landing.title": "Welcome",
      "landing.lead": "Check that your product is authentic and unlock the content made for you.",
      "landing.cta": "Check authenticity",
      "landing.legalLead": "By starting the authentication you accept our",
      "landing.legalAnd": "and the",
      "landing.legalNote": "In this prototype the legal documents are not linked.",

      "menu.lang": "Change language",
      "menu.cookie": "Cookie policy",
      "menu.about": "About the service",
      "menu.help": "Help",
      "menu.signin": "Sign in",
      "menu.note": "In this prototype the menu entries do not lead anywhere.",

      "when.title": "Checking authenticity:",
      "when.before": "Before purchase",
      "when.after": "After purchase",

      "where.title": "Where did you find the product?",
      "where.store": "In a shop",
      "where.online": "Online",
      "where.gift": "It is a gift",

      "place.storeTitle": "Here are the shops near you, pick the one you are in.",
      "place.storeQ": "Enter the name or the address",
      "place.onlineTitle": "Here are the most common sites, pick where you bought it.",
      "place.onlineQ": "Enter the site name or the address",
      "place.near": "Use my location",
      "place.all": "See all shops",
      "place.allOnline": "See all sites",
      "place.note": "In this prototype the list is sample data and the search is not connected to a directory.",
      "place.noGeo": "Location is not available in this prototype: the list above is sample data.",
      "place.picked": "You picked {name}.",

      "processing.p1": "Checking the code…",
      "processing.p2": "Comparing with the purchase context…",
      "processing.p3": "Preparing the outcome…",

      "result.again": "Start over",
      "result.genuine.title": "The product appears authentic",
      "result.genuine.lede": "In this simulation the item matches a registered product and the purchase context you described shows no anomalies.",
      "result.suspicious.title": "More information is needed",
      "result.suspicious.lede": "In this simulation the item is registered, but the purchase context contains details worth looking into.",
      "result.fake.title": "The product does not appear authentic",
      "result.fake.lede": "In this simulation the item matches no registered product. This is the outcome the service would return for an unrecognised article.",
      "result.notFound.title": "Item not registered",
      "result.notFound.lede": "In this simulation the item is not in the archive. Usually that means the code was misread.",
      "result.s1": "Keep the receipt and the packaging.",
      "result.s2": "Photograph the label with the code clearly readable.",
      "result.s3": "Contact the brand's customer service and report the outcome.",
      "result.s4": "If you bought online, report the listing to the platform.",

      "demo.title": "Demonstration prototype.",
      "demo.body": "This page performs no real verification: the outcome is simulated in the browser and does not come from an authentication service. Do not use it to decide whether a product is genuine.",
      "demo.assets": "The images and the video are placeholders: they will be replaced by the files supplied by the brand.",
      "demo.try": "Sample outcomes:",
      "demo.short": "The outcome is simulated: no real verification is performed."
    }
  };

  var ctx = {
    lang: "it", step: "landing",
    code: "", when: null, where: null, place: "",
    verdict: null, runId: 0, timers: [],
    stack: ["landing"], drawerOpen: false, lastFocus: null, hasService: false
  };

  function t(key, vars) {
    var s = I18N[ctx.lang][key];
    if (s == null) s = I18N.it[key] != null ? I18N.it[key] : key;
    if (vars) for (var k in vars) s = s.split("{" + k + "}").join(vars[k]);
    return s;
  }
  function $(sel) { return document.querySelector(sel); }
  function elem(tag, cls) { var n = document.createElement(tag); if (cls) n.className = cls; return n; }
  function svgNode(d, size, opts) {
    var NS = "http://www.w3.org/2000/svg", s = document.createElementNS(NS, "svg");
    s.setAttribute("width", size); s.setAttribute("height", size);
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", (opts && opts.fill) || "none");
    if (!opts || !opts.fill) {
      s.setAttribute("stroke", "currentColor");
      s.setAttribute("stroke-width", (opts && opts.w) || "2");
      s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
    }
    s.setAttribute("aria-hidden", "true");
    var p = document.createElementNS(NS, "path"); p.setAttribute("d", d); s.appendChild(p);
    return s;
  }
  function chevron() { return svgNode("m9 5 7 7-7 7", "16", { w: "2.2" }); }

  var ORDER = ["landing", "when", "where", "place", "processing", "result"];
  var panels = {};
  ORDER.forEach(function (s) { panels[s] = $("#step-" + s); });
  var FOCUS = { landing: "#h-landing", when: "#h-when", where: "#h-where",
                place: "#h-place", processing: "#h-processing", result: "#h-result" };
  var T = { P2: 850, P3: 1650, DONE: 2400 };

  /* ------------------------------------------------------- the simulation */
  var DEFAULT_CODE = "123456789012";
  function isComplete(c) { return /^\d{12}$/.test(c); }
  function isUnknown(c) { return /^(\d)\1{11}$/.test(c); }
  function digitSum(c) { var s = 0, i; for (i = 0; i < c.length; i++) s += +c[i]; return s; }

  /* ------------------------------------------------------------------------
     SIMULATION ONLY, and the single place an outcome is produced. Replace the
     body with the real authentication call, keeping the null return for
     anything that is not a complete, registered item.
     ------------------------------------------------------------------------ */
  function computeVerdict(c) {
    if (!isComplete(c)) return null;
    if (isUnknown(c)) return "notFound";
    return ["genuine", "suspicious", "fake"][digitSum(c) % 3];
  }

  function stepAllowed(step) {
    if (step === "landing") return true;
    if (!isComplete(ctx.code)) return false;
    if (step === "when") return true;
    if (step === "where") return !!ctx.when;
    if (step === "place") return !!ctx.where && ctx.where !== "gift";
    if (step === "processing") return !!ctx.where;
    if (step === "result") return !!ctx.verdict;
    return false;
  }

  /* ------------------------------------------------------------- routing */
  var historyOK = (function () {
    try { history.replaceState({ step: "landing" }, ""); return true; }
    catch (_) { return false; }
  })();
  function pushStep(step) {
    ctx.stack.push(step);
    if (historyOK) { try { history.pushState({ step: step }, ""); } catch (_) { historyOK = false; } }
  }
  function cancelTimers() { ctx.timers.forEach(clearTimeout); ctx.timers = []; }

  function showStep(step) {
    /* Screens whose content depends on earlier answers must be repainted here,
       not once at boot: this is the single point every navigation path goes
       through. "Where" gains a third option once the item is already owned. */
    if (step === "where") paintWhere();
    if (step === "place") renderPlace();
    ORDER.forEach(function (s) { panels[s].hidden = (s !== step); });
    ctx.step = step;
    var onDark = (step !== "landing");
    $("#stage").hidden = !onDark;
    $("#poweredby").hidden = !onDark || !ctx.hasService;
    $("#shell").classList.toggle("on-dark", onDark);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", onDark ? "#000000" : "#ffffff");
    $("#btn-back").hidden = (step === "landing");
    var demo = $("#demo");
    demo.className = onDark ? "demo demo--dark" : "demo";
    demo.dataset.mode = onDark ? "compact" : "full";
    var target = $(FOCUS[step]);
    if (target) target.focus();
  }

  function goto(step, push) {
    if (ctx.step === "processing" && step !== "processing") { cancelTimers(); ctx.runId++; }
    if (!stepAllowed(step)) step = "landing";
    showStep(step);
    if (push !== false) pushStep(step);
    if (step === "processing") startProcessing();
  }

  function previousOf(step) {
    if (step === "when") return "landing";
    if (step === "where") return "when";
    if (step === "place") return "where";
    if (step === "processing") return ctx.where === "gift" ? "where" : "place";
    return "landing";
  }

  window.addEventListener("popstate", function (e) {
    var step = (e.state && e.state.step) || "landing";
    cancelTimers(); ctx.runId++;
    if (step === "processing") step = previousOf("processing");
    if (!stepAllowed(step)) step = "landing";
    showStep(step);
  });

  $("#btn-back").addEventListener("click", function () {
    if (ctx.drawerOpen) { closeDrawer(); return; }
    if (historyOK) { history.back(); return; }
    ctx.stack.pop();
    var step = ctx.stack[ctx.stack.length - 1] || "landing";
    if (step === "processing") step = previousOf("processing");
    if (!stepAllowed(step)) step = "landing";
    cancelTimers(); ctx.runId++;
    showStep(step);
  });

  /* -------------------------------------------------------------- landing */
  $("#btn-verify").addEventListener("click", function () {
    ctx.when = null; ctx.where = null; ctx.place = ""; ctx.verdict = null;
    goto("when");
  });

  /* -------------------------------------------------------- option screens */
  function renderOptions(host, items, onPick) {
    host.textContent = "";
    items.forEach(function (it) {
      var b = elem("button"); b.type = "button";
      b.appendChild(document.createTextNode(t(it.key)));
      b.appendChild(chevron());
      b.addEventListener("click", function () { onPick(it.value); });
      host.appendChild(b);
    });
  }
  function whereItems() {
    var a = [{ key: "where.store", value: "store" }, { key: "where.online", value: "online" }];
    /* "It is a gift" only makes sense once the item is already owned. */
    if (ctx.when === "after") a.push({ key: "where.gift", value: "gift" });
    return a;
  }
  function paintWhen() {
    renderOptions($("#opts-when"), [
      { key: "when.before", value: "before" }, { key: "when.after", value: "after" }
    ], function (v) { ctx.when = v; ctx.where = null; ctx.place = ""; goto("where"); });
  }
  function paintWhere() {
    renderOptions($("#opts-where"), whereItems(), function (v) {
      ctx.where = v; ctx.place = "";
      goto(v === "gift" ? "processing" : "place");
    });
  }

  /* ----------------------------------------------------------- place step */
  /* Sample directory. Replace with the real one when the endpoint exists. */
  var SAMPLE = {
    store: [
      { name: "Paco Perez — Vestiti Tango", dist: "963 m", addr: "Via Kennedy 12A, Casalserugo", solid: true },
      { name: "Agostini Point", dist: "1026 m", addr: "Italia", solid: false }
    ],
    online: [
      { name: "Sito ufficiale del brand", dist: "", addr: "", solid: true },
      { name: "Rivenditore online autorizzato", dist: "", addr: "", solid: false }
    ]
  };

  function renderPlace() {
    var online = ctx.where === "online";
    $("#h-place").textContent = t(online ? "place.onlineTitle" : "place.storeTitle");
    var q = $("#place-q");
    q.placeholder = t(online ? "place.onlineQ" : "place.storeQ");
    q.setAttribute("aria-label", t(online ? "place.onlineQ" : "place.storeQ"));
    q.value = ctx.place || "";
    $("#near-label").textContent = t("place.near");
    $("#btn-near").setAttribute("aria-label", t("place.near"));
    $("#btn-more").textContent = t(online ? "place.allOnline" : "place.all");
    $("#place-note").textContent = t("place.note");

    var host = $("#stores"); host.textContent = "";
    SAMPLE[online ? "online" : "store"].forEach(function (s) {
      var li = elem("li");
      var b = elem("button", "store" + (s.solid ? "" : " store--outline"));
      b.type = "button";
      var body = elem("div", "store__body");
      var name = elem("div", "store__name"); name.textContent = s.name; body.appendChild(name);
      if (s.dist) {
        var meta = elem("div", "store__meta");
        meta.appendChild(svgNode("M3 11 21 3l-8 18-2-7-8-3Z", "14", { fill: "currentColor" }));
        var dd = elem("span"); dd.textContent = s.dist; meta.appendChild(dd);
        body.appendChild(meta);
      }
      if (s.addr) { var ad = elem("div", "store__addr"); ad.textContent = s.addr; body.appendChild(ad); }
      b.appendChild(body);
      b.appendChild(chevron());
      b.addEventListener("click", function () { ctx.place = s.name; goto("processing"); });
      li.appendChild(b); host.appendChild(li);
    });
  }

  $("#form-place").addEventListener("submit", function (e) {
    e.preventDefault();
    ctx.place = $("#place-q").value.trim();
    goto("processing");
  });
  $("#btn-near").addEventListener("click", function () { $("#place-note").textContent = t("place.noGeo"); });
  $("#btn-more").addEventListener("click", function () { $("#place-note").textContent = t("place.note"); });

  /* ------------------------------------------------------------ processing */
  function startProcessing() {
    /* The one choke point: nothing reaches an outcome without a complete code. */
    if (!isComplete(ctx.code)) { ctx.verdict = null; showStep("landing"); return; }
    var run = ++ctx.runId;
    var status = $("#processing-status");
    status.textContent = t("processing.p1");
    ctx.timers = [
      setTimeout(function () { if (run === ctx.runId) status.textContent = t("processing.p2"); }, T.P2),
      setTimeout(function () { if (run === ctx.runId) status.textContent = t("processing.p3"); }, T.P3),
      setTimeout(function () {
        if (run !== ctx.runId) return;
        ctx.timers = [];
        var v = computeVerdict(ctx.code);
        if (!v) { showStep("landing"); return; }
        ctx.verdict = v;
        showStep("result");
        renderResult();
        pushStep("result");
      }, T.DONE)
    ];
  }

  /* ---------------------------------------------------------------- result */
  var MARKS = {
    genuine: "M4 12.5 9.5 18 20 6.5",
    suspicious: "M12 4.5v10M12 19.5h.01",
    fake: "M6 6l12 12M18 6 6 18",
    notFound: "M12 4.5v10M12 19.5h.01"
  };
  function renderResult() {
    var v = ctx.verdict;
    if (!v) return;
    $("#verdict").dataset.v = (v === "notFound" ? "fake" : v);
    var mark = $("#verdict-mark"); mark.textContent = "";
    mark.appendChild(svgNode(MARKS[v] || MARKS.suspicious, "56", { w: "2.2" }));
    $("#h-result").textContent = t("result." + v + ".title");
    $("#verdict-lede").textContent = t("result." + v + ".lede");
    var steps = $("#verdict-steps"); steps.textContent = "";
    var keys = v === "genuine" ? ["result.s1", "result.s2"]
             : v === "suspicious" ? ["result.s1", "result.s2", "result.s3"]
             : ["result.s1", "result.s2", "result.s3", "result.s4"];
    keys.forEach(function (k) {
      var li = elem("li"); li.setAttribute("role", "listitem"); li.textContent = t(k); steps.appendChild(li);
    });
  }

  $("#btn-again").addEventListener("click", function () {
    cancelTimers(); ctx.runId++;
    ctx.when = null; ctx.where = null; ctx.place = ""; ctx.verdict = null;
    $("#verdict").dataset.v = "";
    $("#verdict-mark").textContent = "";
    $("#h-result").textContent = "";
    $("#verdict-lede").textContent = "";
    $("#verdict-steps").textContent = "";
    $("#legal-note").textContent = "";
    ctx.stack = [];
    goto("landing");
  });

  /* --------------------------------------------------------------- drawer */
  function openDrawer() {
    ctx.lastFocus = document.activeElement;
    ctx.drawerOpen = true;
    $("#drawer").hidden = false; $("#drawer-backdrop").hidden = false;
    requestAnimationFrame(function () {
      $("#drawer").classList.add("is-open");
      $("#drawer-backdrop").classList.add("is-open");
    });
    $("#btn-menu").setAttribute("aria-expanded", "true");
    /* The page behind a modal drawer must be inert, not merely dimmed:
       otherwise a screen reader still walks through it. */
    var sh = $("#shell");
    sh.setAttribute("aria-hidden", "true");
    if ("inert" in HTMLElement.prototype) sh.inert = true;
    $("#drawer-close").focus();
  }
  function closeDrawer() {
    ctx.drawerOpen = false;
    var sh = $("#shell");
    sh.removeAttribute("aria-hidden");
    if ("inert" in HTMLElement.prototype) sh.inert = false;
    $("#drawer").classList.remove("is-open");
    $("#drawer-backdrop").classList.remove("is-open");
    $("#btn-menu").setAttribute("aria-expanded", "false");
    $("#drawer-note").textContent = "";
    $("#lang-group").hidden = true;
    var d = $("#drawer"), bd = $("#drawer-backdrop");
    setTimeout(function () { if (!ctx.drawerOpen) { d.hidden = true; bd.hidden = true; } }, 280);
    if (ctx.lastFocus && ctx.lastFocus.focus) ctx.lastFocus.focus();
  }
  $("#btn-menu").addEventListener("click", function () { ctx.drawerOpen ? closeDrawer() : openDrawer(); });
  $("#drawer-close").addEventListener("click", closeDrawer);
  $("#drawer-backdrop").addEventListener("click", closeDrawer);
  $("#btn-lang").addEventListener("click", function () {
    var g = $("#lang-group"); g.hidden = !g.hidden;
    if (!g.hidden) g.querySelector("button").focus();
  });
  Array.prototype.forEach.call(document.querySelectorAll(".doc-link"), function (b) {
    b.addEventListener("click", function () {
      var about = b.querySelector("[data-i18n='menu.about']");
      $("#drawer-note").textContent = about ? t("demo.title") + " " + t("demo.body") : t("menu.note");
    });
  });
  $("#drawer").addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.preventDefault(); closeDrawer(); return; }
    if (e.key !== "Tab") return;
    var f = Array.prototype.filter.call(this.querySelectorAll("button"), function (n) { return n.offsetParent !== null; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* --------------------------------------------------------------- legal */
  Array.prototype.forEach.call(document.querySelectorAll(".legal-link"), function (b) {
    b.addEventListener("click", function () { $("#legal-note").textContent = t("landing.legalNote"); });
  });

  /* -------------------------------------------------------------- assets */
  function fillMedia(imgId, videoId, phId, image, video) {
    var img = $(imgId), vid = $(videoId), ph = $(phId);
    if (video) {
      vid.src = video; vid.hidden = false; ph.hidden = true;
      vid.setAttribute("poster", image || "");
      var p = vid.play(); if (p && p.catch) p.catch(function () {});
    } else if (image) {
      img.src = image; img.hidden = false; ph.hidden = true;
    }
  }
  function applyAssets() {
    if (ASSETS.logo) {
      var b = $("#brand"); b.textContent = "";
      var i = new Image(); i.src = ASSETS.logo; i.alt = t("ui.brand"); b.appendChild(i);
    }
    /* The attribution row only appears once the service mark or name is set;
       an empty placeholder there would read as a real credit. */
    var sm = $("#service-mark"); sm.textContent = "";
    ctx.hasService = !!(ASSETS.serviceLogo || ASSETS.serviceName);
    if (ASSETS.serviceLogo) {
      var si = new Image(); si.src = ASSETS.serviceLogo; si.alt = ASSETS.serviceName || t("ui.service");
      si.style.maxHeight = "16px"; sm.appendChild(si);
    } else if (ASSETS.serviceName) {
      sm.textContent = ASSETS.serviceName;
    }
    fillMedia("#hero-img", "#hero-video", "#hero-placeholder", ASSETS.hero, ASSETS.heroVideo);
    fillMedia("#stage-img", "#stage-video", "#stage-placeholder", ASSETS.background, ASSETS.backgroundVideo);
  }

  /* ----------------------------------------------------------- demo note */
  function renderDemo() {
    var host = $("#demo"); host.textContent = "";
    var short = elem("p", "demo__short");
    var ss = elem("strong"); ss.textContent = t("demo.title"); short.appendChild(ss);
    short.appendChild(document.createTextNode(" " + t("demo.short")));
    host.appendChild(short);
    var full = elem("div", "demo__full");
    var p1 = elem("p");
    var st = elem("strong"); st.textContent = t("demo.title"); p1.appendChild(st);
    p1.appendChild(document.createTextNode(" " + t("demo.body")));
    full.appendChild(p1);
    var p2 = elem("p"); p2.textContent = t("demo.assets"); full.appendChild(p2);
    var p3 = elem("p");
    p3.appendChild(document.createTextNode(t("demo.try") + " "));
    [["genuine", "123456789012"], ["suspicious", "123456789013"],
     ["fake", "123456789014"], ["notFound", "000000000000"]].forEach(function (pair, n) {
      if (n) p3.appendChild(document.createTextNode(" · "));
      var a = elem("a"); a.href = "?clg=" + pair[1];
      var c = elem("code"); c.textContent = t("result." + pair[0] + ".title");
      a.appendChild(c); p3.appendChild(a);
    });
    full.appendChild(p3);
    host.appendChild(full);
  }

  /* ------------------------------------------------------------ language */
  function applyI18n() {
    document.documentElement.lang = ctx.lang;
    document.title = t("meta.title");
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (n) {
      n.textContent = t(n.getAttribute("data-i18n"));
    });
    $("#lang-group").setAttribute("aria-label", t("ui.lang"));
    paintWhen(); paintWhere();
    if (ctx.where && ctx.where !== "gift") renderPlace();
    if (ctx.verdict) renderResult();
    applyAssets();
    renderDemo();
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (b) {
    b.addEventListener("click", function () {
      ctx.lang = b.getAttribute("data-lang");
      Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (o) {
        o.setAttribute("aria-pressed", o === b ? "true" : "false");
      });
      applyI18n();
    });
  });

  /* ---------------------------------------------------------------- boot */
  (function boot() {
    var params = new URLSearchParams(location.search);
    if ((params.get("lang") || "").toLowerCase() === "en") {
      ctx.lang = "en";
      Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (o) {
        o.setAttribute("aria-pressed", o.getAttribute("data-lang") === "en" ? "true" : "false");
      });
    }
    /* The item arrives with the QR. ?clg= overrides it so each outcome can be
       demonstrated; without it the default sample item is used. */
    var raw = (params.get("clg") || params.get("code") || "").replace(/\D+/g, "");
    ctx.code = raw.length === 12 ? raw : DEFAULT_CODE;
    applyI18n();
    ctx.stack = ["landing"];
    ORDER.forEach(function (s) { panels[s].hidden = (s !== "landing"); });
    ctx.step = "landing";
    $("#btn-back").hidden = true;
    $("#stage").hidden = true;
    $("#poweredby").hidden = true;
  })();
})();
</script>
</body>
</html>
