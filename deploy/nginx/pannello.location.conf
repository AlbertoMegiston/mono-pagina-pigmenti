# Pannello di amministrazione — incluso dentro il server{} del sito.
# Protetto da login (utente + password) su HTTPS; il servizio dietro ascolta
# solo su localhost, quindi si raggiunge unicamente da qui, dopo l'accesso.
location /pannello/ {
    auth_basic "Autenticatore CLG - area riservata";
    auth_basic_user_file /etc/nginx/.htpasswd-autenticatore;
    limit_req zone=pannello burst=5 nodelay;
    # L'Excel del brand viaggia in base64 dentro al JSON (+33%): 25 MB e' lo
    # stesso limite che applica il pannello.
    client_max_body_size 25m;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Decodificare centinaia di DataMatrix richiede qualche secondo.
    proxy_read_timeout 120s;
}
