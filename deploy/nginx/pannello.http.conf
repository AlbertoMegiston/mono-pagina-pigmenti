# Limite sui tentativi di accesso al pannello (contesto http).
# Chiave sull'indirizzo intero: nessuna dipendenza da altre parti della
# configurazione, cosi' questo file e' autonomo e l'ordine di caricamento non
# conta. 30 richieste al minuto bastano per un uso normale e frenano chi
# provasse a indovinare la password.
limit_req_zone $binary_remote_addr zone=pannello:10m rate=30r/m;
